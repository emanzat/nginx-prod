# -----------------------------------------------------------------------
# Serveur HTTPS — TLS termination
# -----------------------------------------------------------------------
server {
    listen 8443 ssl;
    http2  on;
    server_name _;

    # -------------------------------------------------------------------
    # Certificats TLS (montés via Secret K8s)
    # Exemple de volume mount :
    #   volumeMounts:
    #     - name: tls-certs
    #       mountPath: /etc/nginx/certs
    #       readOnly: true
    # -------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # -------------------------------------------------------------------
    # Headers de sécurité
    # -------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"                    always;

    # -------------------------------------------------------------------
    # Proxy vers l'application
    # -------------------------------------------------------------------
    location / {
        proxy_pass         https://host.docker.internal:18443;
        proxy_http_version 1.1;

        # Headers proxy standards
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Connection        "";
    }
}

Tu es architecte Terraform Enterprise. Génère deux repos Terraform pour l'onboarding d'AUIDs de la BU UPM_CARDIF, avec un modèle en deux niveaux.

CONTEXTE
- Aujourd'hui : un workspace unique et un fichier APxxxxx.tf par AUID. Il appelle les modules lz-auid, variableset et policyset, avec des providers Vault aliasés par AUID (namespace = apcode, rôle JWT tfe-upm_cardif-<apcode>-ws-config, clusters Vault a/b).
- Problème : un for_each ne peut pas passer un provider différent à chaque instance de module. On veut 200 AUIDs sans 200 fichiers ni providers générés.
- Mes fichiers actuels sont joints : reprends les sources de modules, versions, providers et valeurs tels quels.

REPO 1 : lz-bu-upm_cardif-ws-config (factory)
- auids.csv (colonnes : apcode, gitlab_repo, region, ibm_account, realm_npr, realm_prd, vault_prd, vault_hprd), lisible dans GitLab.
- csvdecode + for_each : crée un workspace TFE "ws-onboard-<APCODE>" par ligne, branché sur le repo template. Il lui passe les variables apcode, gitlab_domain et auid_config (objet HCL).
- Lance un run initial par workspace (tfe_workspace_run).
- Garde uniquement le policy set global. Providers : environment, vault global (namespace A104155) et tfe.
- Validation du CSV : preconditions Terraform (format APnnnnn, doublons, vault_prd et vault_hprd valent a ou b, pas de valeur vide) + script Python de CI + CODEOWNERS.

REPO 2 : lz-auid-onboarding (template, exécuté par chaque ws-onboard-*)
- Un seul jeu de providers : vault global, gitlab, tfe, et deux aliases vault "prd" et "hprd" avec namespace = var.apcode, rôle = lower(var.apcode), adresse dérivée du cluster a/b (auid_config).
- Appelle lz-auid avec providers = { vault = vault.prd, vault.hprd = vault.hprd }, environment dev/int/qua en realm_npr et prod en realm_prd, user_policies identiques à l'existant.
- Appelle variableset et policyset par AUID (depends_on lz-auid). Le policyset n'est créé que si policies/<APCODE>/ existe.

CONTRAINTES
- Ne pas inventer de contenu : ce que tu ne peux pas lire (par ex. le data source vault_policy_document) devient un TODO explicite, et jamais une valeur par défaut.
- Ne mets pas de valeur fictive dans le CSV : TODO_* pour les inconnues.
- Livre chaque repo avec un README (ajouter un AUID, prérequis Vault, points à vérifier).
- Vérifie la syntaxe HCL et signale tout ce que tu n'as pas pu tester.
