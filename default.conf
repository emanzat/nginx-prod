# -----------------------------------------------------------------------
# Serveur HTTPS — TLS termination
# -----------------------------------------------------------------------
server {
    listen 8443 ssl;
    http2  on;
    server_name _;

    # -------------------------------------------------------------------
    # Certificats TLS (montés via Secret K8s)
    # Exemple de volume mount :
    #   volumeMounts:
    #     - name: tls-certs
    #       mountPath: /etc/nginx/certs
    #       readOnly: true
    # -------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # -------------------------------------------------------------------
    # Headers de sécurité
    # -------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"                    always;

    # -------------------------------------------------------------------
    # Proxy vers l'application
    # -------------------------------------------------------------------
    location / {
        proxy_pass         https://host.docker.internal:18443;
        proxy_http_version 1.1;

        # Headers proxy standards
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Connection        "";
    }
}

Traefik reprend exactement la place de NGINX :

	1.	Les métiers créent des doublons de leurs Ingress avec l'IngressClass Traefik (inactifs tant que Traefik n'est pas installé).
	2.	CS31B désinstalle NGINX.
	3.	CS31B installe Traefik sur 30033.
	4.	Les métiers suppriment les anciens Ingress NGINX.

La Gateway ne change pas, car le nodeport est identique. L'inconvénient : tout bascule d'un coup (« big bang »). Il faut donc avoir testé tous les Ingress sur les clusters NPR avant, et il y a une courte coupure entre les étapes 2 et 3.

Scénario 2 : nouveau nodeport (30034), les deux contrôleurs en parallèle

NGINX et Traefik cohabitent :

	1.	CS31B installe Traefik sur 30034, à côté de NGINX.
	2.	Chaque équipe métier migre à son rythme : elle patche sa VIP sur la Gateway vers 30034 et change l'IngressClass de ses Ingress.
	3.	Quand toutes les VIP sont migrées, CS31B désinstalle NGINX.
	4.	Enfin, l'équipe AL/LB change le nodeport par défaut de la Gateway vers celui de Traefik.

Chaque équipe teste et peut revenir en arrière seule, sans synchronisation avec les autres. Le coût : trouver un nodeport libre sur chaque cluster, et une action supplémentaire pour les métiers (patch des VIP).

En résumé : le scénario 1 est plus simple mais plus risqué. Le scénario 2 est plus progressif et réversible, mais demande plus de coordination.
